<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📋 Task Manager</h1>
            <p class="subtitle">Simple & Beautiful Task Tracking</p>
        </header>

        <!-- Connection Status -->
        <div id="status-bar" class="status-bar">
            <span class="status-dot"></span>
            <span id="status-text">Connecting to backend...</span>
        </div>

        <!-- Add Task Form -->
        <div class="add-task-section">
            <form id="task-form" class="task-form">
                <input type="text" id="task-input" placeholder="What needs to be done?" required autocomplete="off">
                <button type="submit" class="btn-add">
                    <span>+</span> Add Task
                </button>
            </form>
        </div>

        <!-- Task Stats -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="total-count">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="completed-count">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="pending-count">0</span>
                <span class="stat-label">Pending</span>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="tasks-container">
            <ul id="tasks-list" class="tasks-list">
                <!-- Tasks will be rendered here -->
            </ul>
            <div id="empty-state" class="empty-state">
                <span class="empty-icon">✨</span>
                <p>No tasks yet. Add your first task above!</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
